<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Lab · A1 → B2</title>
<meta name="description" content="Curso interactivo de inglés de A1 a B2 con ejercicios, flashcards y pronunciación.">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-mark">EL</span>
    <span class="brand-text">English&nbsp;Lab<small>A1 → B2</small></span>
  </a>

  <nav class="topnav" id="topnav">
    <a href="#/" data-nav="dash">Inicio</a>
    <a href="#/cards" data-nav="cards">Repaso</a>
    <a href="#/test" data-nav="test">Nivel</a>
    <a href="#/stats" data-nav="stats">Progreso</a>
  </nav>

  <div class="topbar-right">
    <div class="streak" id="streakChip" title="Días seguidos de práctica">🔥 <b>0</b></div>
    <div class="xp" id="xpChip" title="Puntos de experiencia">⭐ <b>0</b></div>
    <!-- Se muestra solo si hay firebase-config.json válido. Sin él, la app
         funciona igual pero guardando únicamente en este navegador. -->
    <button class="acct-btn" id="acctBtn" hidden></button>
    <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
  </div>
</header>

<main id="app" class="app"><div class="loading">Cargando curso…</div></main>

<footer class="footer">
  <span>English Lab · corriendo en tu Docker · todo se guarda en este navegador</span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
